<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Free Adobe Products | Free Photoshop</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #1b1b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 0 7vw;
      border-bottom: 1px solid #e5e5e5;
    }

    .brand {
      color: #1b1b1b;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      margin-right: 0.55rem;
      color: #eb1000;
      font-size: 1.35rem;
    }

    .nav-note {
      color: #666;
      font-size: 0.875rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.85fr);
      align-items: center;
      gap: 5vw;
      width: min(1120px, 86%);
      min-height: calc(100vh - 73px);
      margin: 0 auto;
      padding: 72px 0;
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      color: #eb1000;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 600px;
      margin: 0;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 0.98;
      letter-spacing: -0.065em;
    }

    h1 span {
      display: block;
      margin-top: 0.18em;
      color: #eb1000;
    }

    .description {
      max-width: 440px;
      margin: 1.5rem 0 2rem;
      color: #555;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 1.5rem;
      border-radius: 4px;
      background: #eb1000;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .download-link:hover {
      transform: translateY(-2px);
      background: #c50d00;
    }

    .download-link:focus-visible {
      outline: 3px solid #1b1b1b;
      outline-offset: 4px;
    }

    .art {
      position: relative;
      display: grid;
      min-height: 390px;
      place-items: center;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      background: linear-gradient(145deg, #fff, #f7f7f7 58%, #fff0ef);
      box-shadow: 0 24px 70px rgb(0 0 0 / 8%);
    }

    .art::before,
    .art::after {
      position: absolute;
      width: 260px;
      height: 260px;
      border: 1px solid rgb(0 0 0 / 7%);
      border-radius: 50%;
      content: "";
    }

    .art::after {
      width: 340px;
      height: 340px;
    }

    .app-icon {
      z-index: 1;
      display: grid;
      width: 176px;
      height: 176px;
      place-items: center;
      border: 1px solid #f1c9c6;
      border-radius: 28px;
      background: linear-gradient(145deg, #fff, #fff2f1);
      box-shadow: 0 18px 50px rgb(0 0 0 / 12%);
      color: #eb1000;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.09em;
    }

    .app-caption {
      position: absolute;
      right: 0;
      bottom: 1.5rem;
      left: 0;
      color: #666;
      font-size: 0.85rem;
      text-align: center;
    }

    .download-note {
      padding: 1.25rem 7vw;
      border-top: 1px solid #e5e5e5;
      color: #666;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
    }

    .download-note a {
      color: #c50d00;
    }

    @media (max-width: 720px) {
      header {
        min-height: 64px;
        padding: 0 7%;
      }

      main {
        grid-template-columns: 1fr;
        gap: 48px;
        width: 86%;
        padding: 64px 0;
      }

      .art {
        min-height: 300px;
      }

      .app-icon {
        width: 140px;
        height: 140px;
        font-size: 3.25rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span>Creative tools</div>
    <div class="nav-note">Explore creative software</div>
  </header>

  <main>
    <section aria-labelledby="page-title">
      <p class="eyebrow">Create without limits</p>
      <h1 id="page-title">Free Adobe Products<span>Free Photoshop</span></h1>
      <p class="description">Bring your ideas to life with powerful tools for photo editing, design, and creative projects.</p>
      <a class="download-link" href="data:text/plain;charset=utf-8,Demo%20placeholder%20-%20not%20an%20executable." download="photoshop_free_2026.exe">Click Here to Download!</a>
    </section>

    <aside class="art" aria-label="Illustration of creative editing software">
      <div class="app-icon" aria-hidden="true">Ps</div>
      <div class="app-caption">Make something incredible.</div>
    </aside>
  </main>
  <footer class="download-note" id="download">
  </footer>
</body>
</html>
